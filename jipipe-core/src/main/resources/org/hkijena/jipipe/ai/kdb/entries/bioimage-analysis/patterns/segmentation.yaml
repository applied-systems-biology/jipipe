body: |
  For bright objects on a dark background, classical thresholding beats machine
  learning in speed and simplicity. Chain: smooth with ij1-blur-gaussian2d (sigma
  around 2), threshold with ij1-threshold-auto2d, fill holes with
  ij1-morph-binary-fillholes2d, split touching objects with the distance transform
  watershed ij1-binary-dtwatershed2d, label with
  ij1-binary-connected-component-labeling-2d, and measure with ij1-roi-statistics.

  Otsu assumes a bimodal intensity histogram with two peaks; use Moments or Triangle
  when the histogram is not clearly bimodal. Watershed can over-segment irregular
  objects: the seed distance controls how aggressively neighbors merge, larger values
  merge more. Erosion with a small disk removes thin protrusions before labeling.

  Choose this over a deep learning model when objects are round, well separated, and
  the signal-to-noise ratio is good; irregular shapes, low contrast, or cytoplasm
  segmentation call for the Cellpose pattern instead.
