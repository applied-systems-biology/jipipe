slots:
  problem: "Segment bright, well-contrasted objects such as DAPI-stained nuclei with thresholding, hole filling, and watershed splitting"
  nodeChain:
    - ij1-blur-gaussian2d
    - ij1-threshold-auto2d
    - ij1-morph-binary-fillholes2d
