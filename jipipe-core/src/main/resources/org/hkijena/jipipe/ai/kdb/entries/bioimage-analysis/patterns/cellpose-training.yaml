  - ground truth annotation
  - omnipose training
slots:
  problem: "Pretrained Cellpose models underperform on your data and you need a custom model trained on annotated images"
  nodeChain:
    - import-file-list
    - import-imagej-bioformats
    - annotate-with-data
    - cellpose-segmentation-training-3.x
    - cellpose-segmentation-inference-3.x
  parameterEvidence:
    - "Training and application live in separate compartments (the Train Then Apply architecture); the observed example pairs a 29 node training compartment with a 4 node application compartment; see workflow-pattern-analysis.md section 9.3"
  crossRefs:
