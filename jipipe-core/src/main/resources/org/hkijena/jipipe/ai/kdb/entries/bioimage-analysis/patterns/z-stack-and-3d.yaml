body: |
  Decide per experiment between projecting to 2D and processing in 3D. Project when
  objects do not overlap in depth and speed matters: ij1-dimensions-zproject for
  maximum, mean, or sum projections, or ij1-dimensions-extended-depth-of-focus when
  edges matter more than peak brightness. Process in 3D when you need volumetric
  numbers or objects overlap in depth.

  3D chain: threshold the stack, split touching objects with
  ij3d-segmentation-watershed-3d, convert labels to ROI with ij3d-labels-to-roi,
  measure volume, surface, sphericity, and elongation with ij3d-measure-roi3d, and
  overlay with ij3d-roi-convert-to-rgb. Cellpose runs in 3D mode on the whole stack
  when a GPU is available. Deconvolution with a point-spread function sharpens
  confocal stacks before further processing.

  Watch the voxels: z-spacing is often larger than the lateral pixel size, which
  biases distances and volumes when voxels are not isotropic; set the physical
  dimensions or resample. Large stacks are memory heavy, so reduce parallelism or
  process tiles.
