slots:
  problem: "Process 3D microscopy data: project the stack to 2D or segment and measure in 3D"
  nodeChain:
    - ij1-dimensions-zproject
    - ij1-dimensions-extended-depth-of-focus
    - ij3d-segmentation-watershed-3d
    - ij3d-labels-to-roi
    - ij3d-measure-roi3d
    - ij3d-roi-convert-to-rgb
  parameterEvidence:
    - "Extended depth of focus is the most distinctive recurring subgraph (85 instances across about 15 workflows), nearly always with split-mode To3D; see workflow-pattern-analysis.md sections 3.2 and 4.5"
    - "ij3d-measure-roi3d (112) and ij3d-roi-convert-to-rgb (174) are the core 3D ROI measurement and visualization nodes; see workflow-pattern-analysis.md section 7.6"
  crossRefs:
