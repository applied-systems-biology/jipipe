body: |
  JIPipe ships algorithms with no ImageJ equivalent. Filter 2D ROI by overlap with
  ij1-roi-filter-by-overlap-v2 finds objects inside other objects and, in consume
  mode, removes duplicates. ij3d-measure-pairwise-roi3d computes distances and
  overlap fractions for all object pairs. ij1-roi-calculator does AND, OR, and XOR
  algebra, for example a nuclear ring as cytoplasm minus nucleus, or
  ij1-roi-enlarge-shrink plus XOR for a band of fixed width.

  Label image operations: ij1-labels-filter-filter-by-expression-2d filters labels by
  area, intensity, or shape and keeps label maps unique; expand, merge, split, and
  Dice or Jaccard comparison of two label maps complete the set. Different threshold
  values per image are handled with threshold-by-annotation or adaptive parameters;
  threshold-iterative-by-roi-statistics-2d finds the threshold that matches an
  expected object size range.

  Further additions: ij1-roi-outline-concave-hull-moreira-santos for tight boundaries
  around scattered detections, multi-template matching, optical flow for motion,
  illumination correction for uneven backgrounds, and
  generate-placeholder-for-missing-data so incomplete batches do not stall the
  pipeline. Enable the adaptive toggle on nearly any parameter to vary it per image
  by expression.
