slots:
  problem: "Solve tasks that classical tools cannot express, such as overlap filtering, pairwise object statistics, boolean ROI algebra, and per-image adaptive parameters"
  nodeChain:
    - ij1-roi-filter-by-overlap-v2
    - ij3d-measure-pairwise-roi3d
    - ij1-roi-calculator
    - ij1-labels-filter-filter-by-expression-2d
    - threshold-by-annotation
    - threshold-iterative-by-roi-statistics-2d
    - generate-placeholder-for-missing-data
    - ij1-roi-outline-concave-hull-moreira-santos
    - ij1-roi-enlarge-shrink
  parameterEvidence:
