stages:
  - ".pre"
  - build
  - package
  - publish
  - ".post"

cache:
  key:
    files:
      - pom.xml
      - "**/pom.xml"
  paths:
    - ".m2/repository/"
  policy: pull-push

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"
  GIT_CLEAN_FLAGS: "-ffdx -e .m2/"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_TLS_CERTDIR: ""

.default_build_template:
  interruptible: true
  retry: 1
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y nsis git git-lfs zip unzip
    - git lfs install --force
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

distribution_package:
  stage: package
  interruptible: true
  retry: 1
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y nsis git git-lfs zip unzip
    - git lfs install --force
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - mvn -B -ntp -DskipTests dependency:go-offline
    - git clone --depth 1 https://asb-git.hki-jena.de/RGerst/jipipe-distribution-files.git
    - cd jipipe-distribution-files/scripts
    - ./step1-publish-snapshot-ci.sh "" "${CI_PIPELINE_IID}"
    - ./step2-create-zip.sh
    - ./step3-build-packages.sh
    - cd ..
    - OUTDIR="$(ls -d *-snapshot${CI_PIPELINE_IID} | head -n 1)"
    - test -n "$OUTDIR" || { echo "Snapshot output dir not found"; ls -lah; exit 1; }
    - ls -lah "$OUTDIR"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID}/*

upload_to_package_registry:
  stage: publish
  needs:
    - job: distribution_package
      artifacts: true
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y git curl jq
  script:
    - set -euo pipefail

    - |
      OUTDIR="$(ls -d jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID} | head -n 1)"
      test -n "$OUTDIR" || {
        echo "Snapshot outdir not found"
        ls -lah jipipe-distribution-files || true
        exit 1
      }

    - |
      ONE="$(
        ls "$OUTDIR"/JIPipe-*-snapshot${CI_PIPELINE_IID}.zip 2>/dev/null \
          | grep -v Prepackaged \
          | head -n 1 \
          || true
      )"

      if [ -z "$ONE" ]; then
        echo "Could not find the plugins zip JIPipe-*-snapshot${CI_PIPELINE_IID}.zip to infer version"
        ls -lah "$OUTDIR"
        exit 1
      fi

    - |
      BASE="$(basename "$ONE")"
      BASE="${BASE#JIPipe-}"
      VERSION_BASE="${BASE%-snapshot${CI_PIPELINE_IID}.zip}"
      VERSION="${VERSION_BASE}-snapshot${CI_PIPELINE_IID}"

      PKG="jipipe"
      BASE_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG/$VERSION"

      echo "Publishing $OUTDIR as $PKG/$VERSION"
      echo "Base API URL: $BASE_API"

      test -n "${PACKAGE_UPLOAD_TOKEN:-}" || {
        echo "PACKAGE_UPLOAD_TOKEN is not set. Create a masked CI/CD variable containing a GitLab project access token with api scope."
        exit 1
      }

      echo "Testing PACKAGE_UPLOAD_TOKEN against project API ..."
      token_test_code="$(
        curl \
          --silent \
          --show-error \
          --output /tmp/package-token-test-body.txt \
          --write-out "%{http_code}" \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      )"
      echo "Token test HTTP status: $token_test_code"
      if [ "$token_test_code" != "200" ]; then
        echo "PACKAGE_UPLOAD_TOKEN could not access this project via the GitLab API."
        cat /tmp/package-token-test-body.txt || true
        exit 1
      fi

    - |
      SNAPSHOT_SUFFIX="${VERSION#${VERSION_BASE}-}"

      FILES="$(
        find "$OUTDIR" -maxdepth 1 -type f -size +0c \( \
          -name "JIPipe-*-${SNAPSHOT_SUFFIX}-Installer-Win64.exe" -o \
          -name "JIPipe-*-${SNAPSHOT_SUFFIX}-Prepackaged-Win64.zip" -o \
          -name "JIPipe-*-${SNAPSHOT_SUFFIX}-Prepackaged-macOS.zip" -o \
          -name "JIPipe-*-${SNAPSHOT_SUFFIX}-Prepackaged-Linux64.tar.gz" -o \
          -name "JIPipe-${VERSION}.zip" \
        \) | sort
      )"

      if [ -z "$FILES" ]; then
        echo "No matching package files found"
        echo "Expected files for version: $VERSION"
        ls -lah "$OUTDIR"
        exit 1
      fi

      echo "Files selected for upload:"
      echo "$FILES" | sed 's/^/  - /'

    - |
      echo "# JIPipe $VERSION download URLs" > "urls-${VERSION}.txt"

      upload_one() {
        f="$1"
        name="$(basename "$f")"
        url="$BASE_API/$name"

        echo "Uploading $name ..."

        body="$(mktemp)"
        headers="$(mktemp)"

        http_code="$(
          curl \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            --fail-with-body \
            --upload-file "$f" \
            --dump-header "$headers" \
            --output "$body" \
            --write-out "%{http_code}" \
            --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
            --header "Expect:" \
            "$url"
        )"

        echo "HTTP status for $name: $http_code"

        if [ "$http_code" != "201" ]; then
          echo "Upload failed for $name"
          echo
          echo "Response headers:"
          cat "$headers" || true
          echo
          echo "Response body:"
          cat "$body" || true
          echo
          exit 1
        fi

        echo "Upload successful for $name"
        cat "$body" || true
        echo

        echo "$url" >> "urls-${VERSION}.txt"
      }

      echo "$FILES" | while IFS= read -r f; do
        [ -n "$f" ] || continue
        upload_one "$f"
      done

    - |
      echo "Verifying uploaded package files ..."

      package_lookup_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=$PKG&package_version=$VERSION"

      package_json="$(
        curl \
          --silent \
          --show-error \
          --fail-with-body \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$package_lookup_url"
      )"

      package_id="$(echo "$package_json" | jq -r '.[0].id // empty')"

      if [ -z "$package_id" ]; then
        echo "Could not find package after upload: $PKG/$VERSION"
        echo "$package_json" | jq . || echo "$package_json"
        exit 1
      fi

      echo "Found package ID: $package_id"

      package_files_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$package_id/package_files?per_page=100"

      files_json="$(
        curl \
          --silent \
          --show-error \
          --fail-with-body \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$package_files_url"
      )"

      echo "$FILES" | while IFS= read -r f; do
        [ -n "$f" ] || continue
        name="$(basename "$f")"

        if ! echo "$files_json" | jq -e --arg name "$name" '.[] | select(.file_name == $name)' >/dev/null; then
          echo "Missing uploaded package file: $name"
          echo "Package files returned by GitLab:"
          echo "$files_json" | jq . || echo "$files_json"
          exit 1
        fi

        echo "Verified package file: $name"
      done

      echo "All expected package files are present."

    - echo "Done. URLs written to urls-${VERSION}.txt"

  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  artifacts:
    when: always
    expire_in: 3 months
    paths:
      - urls-*.txt

docker_build_push:
  stage: publish
  needs:
    - job: distribution_package
      artifacts: true
    - job: upload_to_package_registry
      artifacts: true
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - set -euo pipefail
    - |
      OUTDIR="$(ls -d jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID} | head -n 1)"
      test -n "$OUTDIR" || { echo "Snapshot outdir not found"; exit 1; }
    - |
      TAR_GZ="$(ls "$OUTDIR"/JIPipe-*-Prepackaged-Linux64.tar.gz | head -n 1)"
      test -n "$TAR_GZ" || { echo "Linux64 tar.gz not found"; ls -lah "$OUTDIR"; exit 1; }
    - |
      BASE="$(basename "$TAR_GZ")"
      BASE="${BASE#JIPipe-}"
      VERSION_BASE="${BASE%-Prepackaged-Linux64.tar.gz}"
      VERSION="${VERSION_BASE%-snapshot*}"
      echo "JIPipe version: ${VERSION}"
    - |
      docker build \
        --build-arg PACKAGE_PATH="$TAR_GZ" \
        -t appsysbiohkijena/jipipe:${VERSION} \
        -t appsysbiohkijena/jipipe:latest \
        -f dist/docker/Dockerfile \
        .
    - |
      echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
      docker push appsysbiohkijena/jipipe:${VERSION}
      docker push appsysbiohkijena/jipipe:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

verify_ro_crate:
  stage: publish
  needs:
    - job: docker_build_push
  image: python:3.12-slim
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apt-get update
    - apt-get install -y curl jq bash
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz | tar xz -C /tmp
    - mv /tmp/docker/docker /usr/local/bin/docker
  script:
    - set -euo pipefail
    - |
      pip install --break-system-packages websockets cwltool
    - |
      docker run -d --name jipipe-verify \
        -e JAVA_TOOL_OPTIONS=-Djipipe.instrumentation.bind=0.0.0.0 \
        -p 8780:8780 \
        -v "$(pwd)/dist/docker/test-data:/test-data" \
        -v /tmp/jipipe-output:/output \
        appsysbiohkijena/jipipe:latest \
        --instrumentation 8780 \
        /test-data/kidney_with_user_dirs.jip
    - |
      sleep 5
      CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' jipipe-verify)
      python3 dist/docker/verify_ro_crate.py /output/kidney.crate.zip /tmp/jipipe-output/kidney.crate.zip "ws://${CONTAINER_IP}:8780/"
    - |
      cwltool --validate /tmp/crate-extracted/workflow.cwl
    - |
      echo "RO-Crate validation passed for kidney_with_user_dirs.jip"
    - |
      docker stop jipipe-verify || true
      docker rm jipipe-verify || true
    - |
      docker run -d --name jipipe-verify-2 \
        -e JAVA_TOOL_OPTIONS=-Djipipe.instrumentation.bind=0.0.0.0 \
        -p 8780:8780 \
        -v "$(pwd)/dist/docker/test-data:/test-data" \
        -v /tmp/jipipe-output-2:/output \
        appsysbiohkijena/jipipe:latest \
        --instrumentation 8780 \
        /test-data/kidney.jip
    - |
      sleep 5
      CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' jipipe-verify-2)
      python3 dist/docker/verify_ro_crate.py /output/kidney.crate.zip /tmp/jipipe-output-2/kidney.crate.zip "ws://${CONTAINER_IP}:8780/"
    - |
      cwltool --validate /tmp/crate-extracted/workflow.cwl
    - |
      echo "RO-Crate validation passed for kidney.jip"
    - |
      docker stop jipipe-verify-2 || true
      docker rm jipipe-verify-2 || true
  after_script:
    - docker stop jipipe-verify || true
    - docker rm jipipe-verify || true
    - docker stop jipipe-verify-2 || true
    - docker rm jipipe-verify-2 || true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

build_feature_branch:
  stage: build
  interruptible: true
  retry: 1
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y zip wget
  script:
    - echo "Pre-warming dependencies..."
    - mvn -B -ntp -DskipTests dependency:go-offline
    - echo "Building JIPipe for feature branch"
    - mvn -B -ntp clean compile
    - mvn -B -ntp clean package
    - cd dist/zip
    - ./build-no-dependencies.sh
    - echo "Build completed. Finding generated ZIP files..."
    - find . -name "JIPipe-*.zip" -type f | head -5
  artifacts:
    name: jipipe-zip-files-$CI_PIPELINE_ID
    paths:
      - dist/zip/JIPipe-*.zip
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH != "master"

feature_branch_package:
  stage: package
  interruptible: true
  retry: 1
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y git git-lfs zip unzip wget
    - git lfs install --force
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - mvn -B -ntp -DskipTests dependency:go-offline
    - git clone --depth 1 https://asb-git.hki-jena.de/RGerst/jipipe-distribution-files.git
    - cd jipipe-distribution-files/scripts
    - ./step1-publish-snapshot-ci.sh "" "${CI_PIPELINE_IID}"
    - ./step2-create-zip.sh
    - ./step3-build-packages-linux64.sh
    - cd ..
    - OUTDIR="$(ls -d *-snapshot${CI_PIPELINE_IID} | head -n 1)"
    - test -n "$OUTDIR" || { echo "Snapshot output dir not found"; ls -lah; exit 1; }
    - TAR_GZ="$(ls "$OUTDIR"/JIPipe-*-Prepackaged-Linux64.tar.gz | head -n 1)"
    - test -n "$TAR_GZ" || { echo "Linux64 tar.gz not found"; ls -lah "$OUTDIR"; exit 1; }
    - 'echo "Linux64 package: $TAR_GZ"'
    - ls -lah "$OUTDIR"
  rules:
    - if: $CI_COMMIT_BRANCH != "master"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID}/JIPipe-*-Prepackaged-Linux64.tar.gz

feature_branch_verify_ro_crate:
  stage: publish
  needs:
    - job: feature_branch_package
      artifacts: true
  image: python:3.12-slim
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apt-get update
    - apt-get install -y curl jq bash
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz | tar xz -C /tmp
    - mv /tmp/docker/docker /usr/local/bin/docker
  script:
    - set -euo pipefail
    - pip install --break-system-packages websockets cwltool
    - |
      OUTDIR="$(ls -d jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID} | head -n 1)"
      test -n "$OUTDIR" || { echo "Snapshot outdir not found"; exit 1; }
    - |
      TAR_GZ="$(ls "$OUTDIR"/JIPipe-*-Prepackaged-Linux64.tar.gz | head -n 1)"
      test -n "$TAR_GZ" || { echo "Linux64 tar.gz not found"; ls -lah "$OUTDIR"; exit 1; }
    - |
      docker build \
        --build-arg PACKAGE_PATH="$TAR_GZ" \
        -t jipipe-verify:latest \
        -f dist/docker/Dockerfile \
        .
    - |
      docker run -d --name jipipe-verify \
        -e JAVA_TOOL_OPTIONS=-Djipipe.instrumentation.bind=0.0.0.0 \
        -p 8780:8780 \
        -v "$(pwd)/dist/docker/test-data:/test-data" \
        -v /tmp/jipipe-output:/output \
        jipipe-verify:latest \
        --instrumentation 8780 \
        /test-data/kidney_with_user_dirs.jip
    - |
      sleep 30
      echo "=== Container logs ==="
      docker logs jipipe-verify 2>&1 || true
      CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' jipipe-verify)
      python3 dist/docker/verify_ro_crate.py /output/kidney.crate.zip /tmp/jipipe-output/kidney.crate.zip "ws://${CONTAINER_IP}:8780/"
    - |
      cwltool --validate /tmp/crate-extracted/workflow.cwl
    - |
      echo "RO-Crate validation passed for kidney_with_user_dirs.jip"
    - |
      docker stop jipipe-verify || true
      docker rm jipipe-verify || true
    - |
      docker run -d --name jipipe-verify-2 \
        -e JAVA_TOOL_OPTIONS=-Djipipe.instrumentation.bind=0.0.0.0 \
        -p 8780:8780 \
        -v "$(pwd)/dist/docker/test-data:/test-data" \
        -v /tmp/jipipe-output-2:/output \
        jipipe-verify:latest \
        --instrumentation 8780 \
        /test-data/kidney.jip
    - |
      sleep 30
      echo "=== Container 2 logs ==="
      docker logs jipipe-verify-2 2>&1 || true
      CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' jipipe-verify-2)
      python3 dist/docker/verify_ro_crate.py /output/kidney.crate.zip /tmp/jipipe-output-2/kidney.crate.zip "ws://${CONTAINER_IP}:8780/"
    - |
      cwltool --validate /tmp/crate-extracted/workflow.cwl
    - |
      echo "RO-Crate validation passed for kidney.jip"
    - |
      docker stop jipipe-verify-2 || true
      docker rm jipipe-verify-2 || true
  after_script:
    - docker stop jipipe-verify || true
    - docker rm jipipe-verify || true
    - docker stop jipipe-verify-2 || true
    - docker rm jipipe-verify-2 || true
  rules:
    - if: $CI_COMMIT_BRANCH != "master"
