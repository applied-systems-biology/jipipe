image: maven:3-eclipse-temurin-21-jammy

stages: [package, publish]

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"

distribution_package:
  stage: package
  interruptible: true
  retry: 1
  before_script:
    - apt-get update
    - apt-get install -y nsis git git-lfs zip unzip
    - git lfs install
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - git clone --depth 1 https://asb-git.hki-jena.de/RGerst/jipipe-distribution-files.git
    - cd jipipe-distribution-files/scripts
    - ./step1-publish-snapshot-ci.sh "" "${CI_PIPELINE_IID}"
    - ./step2-create-zip.sh
    - ./step3-build-packages.sh
    - cd ..
    - OUTDIR="$(ls -d *-snapshot${CI_PIPELINE_IID} | head -n 1)"
    - test -n "$OUTDIR" || { echo "Snapshot output dir not found"; ls -lah; exit 1; }
    - ls -lah "$OUTDIR"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID}/*

upload_to_package_registry:
  stage: publish
  needs:
    - job: distribution_package
      artifacts: true
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq
  script:
    - set -euo pipefail
    # Locate snapshot output dir from artifacts
    - OUTDIR="$(ls -d jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID} | head -n 1)"
    - test -n "$OUTDIR" || { echo "Snapshot outdir not found"; ls -lah jipipe-distribution-files || true; exit 1; }

    # Infer version from the ImageJ plugins zip: JIPipe-<ver>-snapshot<IID>.zip
    - ONE="$(ls "$OUTDIR"/JIPipe-*-snapshot${CI_PIPELINE_IID}.zip 2>/dev/null | grep -v Prepackaged || true | head -n1)"
    - |
      if [ -z "$ONE" ]; then
        echo "Could not find the plugins zip (JIPipe-*-snapshot${CI_PIPELINE_IID}.zip) to infer version"
        ls -lah "$OUTDIR"
        exit 1
      fi
    - BASE="$(basename "$ONE")"
    - BASE="${BASE#JIPipe-}"
    - VERSION_BASE="${BASE%-snapshot${CI_PIPELINE_IID}.zip}"
    - VERSION="${VERSION_BASE}-snapshot${CI_PIPELINE_IID}"
    - PKG="jipipe"
    - BASE_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG/$VERSION"
    - echo "Publishing $OUTDIR as $PKG/$VERSION"

    # Build the exact file list (only regular files, non-empty, five expected names)
    - |
      FILES="$(find "$OUTDIR" -maxdepth 1 -type f -size +0c \( \
                 -name "JIPipe-*-${VERSION#${VERSION_BASE}-}-Installer-Win64.exe" -o \
                 -name "JIPipe-*-${VERSION#${VERSION_BASE}-}-Prepackaged-Win64.zip" -o \
                 -name "JIPipe-*-${VERSION#${VERSION_BASE}-}-Prepackaged-macOS.zip" -o \
                 -name "JIPipe-*-${VERSION#${VERSION_BASE}-}-Prepackaged-Linux64.tar.gz" -o \
                 -name "JIPipe-${VERSION}.zip" \
               \) | sort)"
      if [ -z "$FILES" ]; then
        echo "No matching package files found (regular, non-empty)"; ls -lah "$OUTDIR"; exit 1
      fi
      echo "$FILES" | sed 's/^/  • /'
    - echo "# JIPipe $VERSION download URLs" > "urls-${VERSION}.txt"

    # Upload each file
    - |
      echo "$FILES" | while IFS= read -r f; do
        [ -n "$f" ] || continue
        name="$(basename "$f")"
        echo "Uploading $name …"
        curl --retry 3 --fail -sS \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$BASE_API/$name"
        echo "$BASE_API/$name" >> "urls-${VERSION}.txt"
      done
    - echo "Done. URLs written to urls-${VERSION}.txt"
  artifacts:
    when: always
    expire_in: 3 months
    paths:
      - urls-*.txt
