image: maven:3-eclipse-temurin-21-jammy

stages: [package, publish]

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"

distribution_package:
  stage: package
  interruptible: true
  retry: 1
  before_script:
    - apt-get update
    - apt-get install -y nsis git git-lfs zip unzip
    - git lfs install
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - git clone --depth 1 https://asb-git.hki-jena.de/RGerst/jipipe-distribution-files.git
    - cd jipipe-distribution-files/scripts
    - ./step1-publish-snapshot-ci.sh "" "${CI_PIPELINE_IID}"
    - ./step2-create-zip.sh
    - ./step3-build-packages.sh
    - cd ..
    - OUTDIR="$(ls -d *-snapshot${CI_PIPELINE_IID} | head -n 1)"
    - test -n "$OUTDIR" || { echo "Snapshot output dir not found"; ls -lah; exit 1; }
    - ls -lah "$OUTDIR"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID}/*

upload_to_package_registry:
  stage: publish
  needs:
    - job: distribution_package
      artifacts: true
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq
  script:
    - set -euo pipefail
    # Locate the snapshot output dir restored from artifacts
    - OUTDIR="$(ls -d jipipe-distribution-files/*-snapshot${CI_PIPELINE_IID} | head -n 1)"
    - test -n "$OUTDIR" || { echo "Snapshot outdir not found"; ls -lah jipipe-distribution-files || true; exit 1; }

    # Infer version from a file like JIPipe-6.0.0-snapshot${IID}.zip
    - ONE="$(ls "$OUTDIR"/JIPipe-*-snapshot${CI_PIPELINE_IID}.zip 2>/dev/null | head -n1 || true)"
    - |
      if [ -z "$ONE" ]; then
        echo "Could not find a *-snapshot${CI_PIPELINE_IID}.zip to infer version"
        ls -lah "$OUTDIR"
        exit 1
      fi
    - BASE="$(basename "$ONE")"
    - BASE="${BASE#JIPipe-}"
    - VERSION_BASE="${BASE%-snapshot${CI_PIPELINE_IID}.zip}"
    - VERSION="${VERSION_BASE}-snapshot${CI_PIPELINE_IID}"
    - PKG="jipipe"
    - echo "Publishing $OUTDIR as $PKG/$VERSION"
    - echo "# JIPipe $VERSION download URLs" > "urls-${VERSION}.txt"

    # Build list of files (POSIX trick: if no match, the literal pattern remains)
    - set -- "$OUTDIR"/JIPipe-*
    - |
      if [ "$1" = "$OUTDIR"/JIPipe-* ]; then
        echo "No JIPipe-* files found in $OUTDIR"
        ls -lah "$OUTDIR"
        exit 1
      fi

    # Upload each file to the Generic Package Registry
    - BASE_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG/$VERSION"
    - |
      for f in "$@"; do
        name="$(basename "$f")"
        echo "Uploading $name …"
        curl --retry 3 --fail -sS \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$BASE_API/$name"
        echo "$BASE_API/$name" >> "urls-${VERSION}.txt"
      done
    - echo "Done. URLs written to urls-${VERSION}.txt"
  artifacts:
    when: always
    expire_in: 3 months
    paths:
      - urls-*.txt

